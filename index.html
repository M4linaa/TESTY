<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Predykcje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050b14; color: white; font-family: 'Inter', sans-serif; }
        .card { background-color: #0b111a; border: 1px solid #1f2937; }
    </style>
</head>
<body class="p-8">

    <!-- Kontener na kafelek -->
    <div class="card max-w-md p-5 rounded-xl shadow-lg">
        
        <!-- Nagłówek kafelka -->
        <div class="flex justify-between items-center mb-4">
            <div class="text-xl font-bold">
                BTC <span class="text-gray-400 text-sm font-normal">$75 189</span>
            </div>
            <div class="px-3 py-1 text-xs border border-red-900 text-red-500 rounded-md">
                Niezdecydowani
            </div>
        </div>

        <!-- Opis czasu -->
        <p class="text-gray-500 text-xs mb-4">
            Przewidywanie z <span class="text-gray-300">wczoraj, 15.09 18:35</span> na dziś, <span class="text-gray-300">16.09 18:35</span>
        </p>

        <!-- Procenty -->
        <div class="flex justify-between text-sm mb-1">
            <span class="text-gray-400">Gracze stawiali na wzrost</span>
            <span class="text-gray-400">na spadek</span>
        </div>
        <div class="flex justify-between items-end mb-2">
            <span class="text-red-500 text-3xl font-bold">47%</span>
            <span class="text-white text-2xl font-bold">53%</span>
        </div>

        <!-- Pasek postępu (Progress bar) -->
        <div class="w-full h-3 bg-red-500 rounded-full flex overflow-hidden mb-4">
            <div class="h-full bg-[#10b981]" style="width: 47%;"></div>
            <div class="h-full bg-red-500" style="width: 53%;"></div>
        </div>

        <!-- Informacje dolne -->
        <div class="text-xs text-gray-500 flex items-center mb-4">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Wynik poznamy 16.09 o 18:00 czasu PL (za ok. 21 godz.)
        </div>

        <div class="bg-gray-900 p-3 rounded-md text-xs text-gray-400 border border-gray-800 flex justify-between">
            <span>Kurs na żywo w trakcie okna: <span class="text-red-500">28% na wzrost</span></span>
            <span>ⓘ</span>
        </div>

        <p class="text-gray-600 text-[10px] mt-4">Źródło: Polymarket</p>
    </div>

</body>
</html>
